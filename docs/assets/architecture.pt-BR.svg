<svg xmlns="http://www.w3.org/2000/svg" width="900" height="746" viewBox="0 0 900 746" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura Firecrawl VPN</title><desc id="desc">Arquitetura: clientes locais e confiáveis chamam Firecrawl. Firecrawl e Playwright compartilham Gluetun e usam Proton VPN para saída pública; Redis, RabbitMQ e PostgreSQL ficam em rede interna.</desc>
